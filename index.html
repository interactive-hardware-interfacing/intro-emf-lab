<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intro EMF Lab</title>
  <!-- KaTeX 0.16.11, vendored (MIT) so the site has no runtime network dependency -->
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <script defer src="vendor/katex/katex.min.js"></script>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-title">Intro EMF Lab</span>
      <span class="brand-sub">EGRE 309 field simulators</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Topics"></nav>
    <div class="topbar-actions">
      <button id="reset-btn" class="btn btn-quiet" title="Return this tab to its default settings">Reset tab</button>
      <button id="share-btn" class="btn" title="Copy a link that reproduces this exact view">Share link</button>
      <a class="btn btn-quiet" href="https://github.com/interactive-hardware-interfacing/intro-EMF-lab" target="_blank" rel="noopener">Source</a>
    </div>
  </header>

  <main class="workspace">
    <aside class="panel panel-left" id="controls" aria-label="Controls"></aside>
    <div class="resizer" id="resize-left" title="Drag to resize"></div>

    <section class="stage" id="stage">
      <nav class="stage-tabs" id="stage-tabs" aria-label="Views"></nav>
      <div class="canvas-stack" id="canvas-stack"></div>
      <div class="stage-view" id="stage-view" hidden></div>
      <div class="stage-footer">
        <div class="colorbar">
          <span class="colorbar-title" id="cb-title"></span>
          <canvas id="colorbar" width="220" height="12"></canvas>
          <div class="colorbar-labels"><span id="cb-max"></span><span id="cb-mid"></span><span id="cb-min"></span></div>
        </div>
        <div class="stage-status" id="status"></div>
      </div>
    </section>

    <div class="resizer" id="resize-right" title="Drag to resize"></div>
    <aside class="panel panel-right">
      <section class="panel-section">
        <h2>Layers</h2>
        <div id="layers" class="layer-list"></div>
        <div class="row">
          <label>Color scale
            <select id="cmap"><option value="viridis">viridis</option><option value="coolwarm">cool-warm</option></select>
          </label>
        </div>
        <div class="row row-minmax">
          <label>Min <input id="cmin" type="text" inputmode="decimal" placeholder="auto"></label>
          <label>Max <input id="cmax" type="text" inputmode="decimal" placeholder="auto"></label>
          <button id="cauto" class="btn btn-small" title="Return to automatic scaling">auto</button>
        </div>
      </section>

      <section class="panel-section">
        <h2>Probe</h2>
        <div class="row row-probe">
          <label id="probe-xlabel">x (m) <input id="probe-x" type="text" inputmode="decimal" value="0"></label>
          <label id="probe-ylabel">y (m) <input id="probe-y" type="text" inputmode="decimal" value="0"></label>
          <button id="probe-update" class="btn btn-small">Update</button>
        </div>
        <p class="hint">Or click anywhere on the plot.</p>
        <table class="probe-table" id="probe-table"><tbody></tbody></table>
        <div class="row">
          <button id="probe-copy" class="btn btn-small">Copy row</button>
          <button id="probe-log" class="btn btn-small">Add to log</button>
          <button id="probe-csv" class="btn btn-small">Download log CSV</button>
        </div>
      </section>

      <section class="panel-section">
        <h2>Equations</h2>
        <div id="equations" class="equations"></div>
      </section>

      <section class="panel-section">
        <h2>Export</h2>
        <div class="row">
          <button id="export-png" class="btn btn-small">PNG snapshot</button>
          <button id="export-csv" class="btn btn-small">Field CSV</button>
        </div>
      </section>
    </aside>
  </main>

  <footer class="foot">
    <span id="foot-phase"></span>
    <span>Plain ES modules, no build step. Every view is reproducible from its URL.</span>
  </footer>

  <script type="module" src="app/main.js"></script>
</body>
</html>
